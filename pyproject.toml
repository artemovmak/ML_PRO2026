[project]
name = "churn-service"
version = "0.5.0"
description = "ML Pro: сервис оттока, семинар 3"
requires-python=">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn>=1.6,<1.7",
    "joblib",
    "psycopg[binary]",
    "mlflow-skinny>=3.16,<4",
    "skops>=0.11",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=8",
    "implicit>=0.7.3",
    "pandera>=0.33.1",
    "scipy>=1.17.1",
    "pyarrow>=25.0.1",
    "dvc[s3]>=3.67.1",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "churn"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна база данных - адрес в DATABASE_URL"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


