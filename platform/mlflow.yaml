apiVersion: v1
kind: Namespace
metadata:
  name: mlops
---
apiVersion: v1
kind: PersistentVolumeClaim #
metadata:
  name: mlflow-data
  namespace: mlops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.16.1
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --artifacts-destination=/mlflow/artifacts
            - --allowed-hosts=mlflow.mlops*,mlflow.localhost*,localhost*,127.0.0.1*
            - --cors-allowed-origins=http://mlflow.localhost
          env:
            # без этого сервер запускает ещё ~10 фоновых воркеров для GenAI-задач, +1.5 ГБ памяти
            - {name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION, value: "false"}
          ports:
            - containerPort: 5000
          volumeMounts:
            - {name: data, mountPath: /mlflow}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mlflow-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
spec:
  selector: {app: mlflow}
  ports:
    - port: 5000
      targetPort: 5000
